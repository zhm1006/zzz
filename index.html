iv><div class="bottom"><div class="bar"><button id="feed">🍓 喂食</button><button id="play">🪄 玩耍</button><button id="sleep">🌙 休息</button><button id="open">☰ 养成</button></div><div class="hint">拖动空白处移动 · 模型为独立授权素材</div></div><section class="panel" id="panel"><button class="close" id="close">✕</button><h2 id="title"></h2><div class="muted" id="subtitle"></div><div id="meters"></div><div class="routes" id="routes"></div><p class="muted">名字（回车保存）</p><input id="name" maxlength="8"><p class="muted">成长取决于你的照顾方式。首次达到 Lv.3 后锁定路线；达到 Lv.6 后继续进化。离线最多结算 24 小时。</p><button id="reset">重新开始</button> <button id="min">最小化</button> <button id="quit">退出软件</button></section><script type="module" src="./renderer.js"></script></body></html>
