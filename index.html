<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>星尾狐 · 桌面伙伴</title><style>*{box-sizing:border-box}body{margin:0;color:#4d3c59;font:13px 'Microsoft YaHei',sans-serif;overflow:hidden;user-select:none}.drag{position:absolute;inset:0 0 90px;cursor:move;-webkit-app-region:drag}canvas{position:absolute;inset:0;pointer-events:none}button,input{-webkit-app-region:no-drag;font:inherit}.speech{position:absolute;top:25px;left:45px;right:45px;text-align:center;background:rgba(255,255,255,.94);border:1px solid #eadff3;border-radius:17px;padding:10px;box-shadow:0 4px 18px #4e286122;pointer-events:none}.bottom{position:absolute;bottom:9px;left:24px;right:24px;text-align:center}.bar{display:inline-flex;gap:5px;padding:7px;background:#fffffff0;border:1px solid #eadff3;border-radius:30px;box-shadow:0 5px 18px #43285b26}button{border:0;border-radius:18px;padding:7px 11px;background:#f3edf9;color:#634d76;cursor:pointer}button:hover{background:#e6d6f5}.panel{display:none;position:absolute;inset:10px 15px 65px;background:#fcf9fffa;border:1px solid #eadbf3;border-radius:20px;padding:17px;box-shadow:0 8px 30px #39274733;overflow:auto}.panel.show{display:block}.panel h2{font-size:18px;margin:0 0 4px}.muted{color:#9d8ba8;font-size:11px}.row{display:flex;align-items:center;gap:7px;margin:9px 0}.meter{flex:1;height:7px;background:#eee6f2;border-radius:9px;overflow:hidden}.fill{height:100%;border-radius:9px;background:linear-gradient(90deg,#e79db7,#ae8add)}.routes{background:#f4edf9;padding:10px;border-radius:12px;line-height:1.8}.close{float:right}input{width:100%;border:1px solid #e3d7ec;border-radius:8px;padding:7px;background:white}.hint{font-size:10px;color:#8d7c98;text-shadow:0 1px white;margin-top:3px}.work-time{font-size:28px;font-weight:700;margin:5px 0;color:#7458a0;font-variant-numeric:tabular-nums}.panel h3{font-size:14px;margin:14px 0 5px}.panel input[type=checkbox]{width:auto}.panel input[type=time],.panel input[type=number]{padding:5px}.todo{display:flex;gap:5px;align-items:center;margin:5px 0}.todo span{flex:1;overflow-wrap:anywhere}.todo.done span{text-decoration:line-through;color:#aaa}.todo button{padding:4px 7px}</style><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body><div class="drag"></div><canvas id="view"></canvas><div class="speech" id="speech">正在唤醒你的狐狸伙伴…</div><div class="bottom"><div class="bar"><button id="feed">🍓 喂食</button><button id="play">🪄 玩耍</button><button id="sleep">🌙 休息</button><button id="workOpen">📋 工作</button><button id="open">☰ 养成</button></div><div class="hint">拖动空白处移动 · 模型为独立授权素材</div></div><section class="panel" id="panel"><button class="close" id="close">✕</button><h2 id="title"></h2><div class="muted" id="subtitle"></div><div id="meters"></div><div class="routes" id="routes"></div><p class="muted">名字（回车保存）</p><input id="name" maxlength="8"><p class="muted">成长取决于你的照顾方式。首次达到 Lv.3 后锁定路线；达到 Lv.6 后继续进化。离线最多结算 24 小时。</p><button id="reset">重新开始</button> <button id="min">最小化</button> <button id="quit">退出软件</button></section><section class="panel" id="workPanel"><button class="close" id="workClose">✕</button><h2>☀ 工作陪伴</h2><div class="muted">今天的工作时长</div><div class="work-time" id="workTime">00:00:00</div><div class="row"><button id="workToggle">开始计时</button><span class="muted" id="workStatus"></span></div><h3>今日待办</h3><div class="row"><input id="todoText" maxlength="80" placeholder="添加一项待办"><input id="todoTime" type="time" title="提醒时间（可选）" style="width:94px"><button id="todoAdd">添加</button></div><div id="todoList"></div><h3>关怀提醒</h3><div class="row"><label><input type="checkbox" id="waterEnabled"> 喝水</label><input id="waterMinutes" type="number" min="1" max="720" style="width:58px"> <span>分钟</span></div><div class="row"><label><input type="checkbox" id="breakEnabled"> 休息</label><input id="breakMinutes" type="number" min="1" max="720" style="width:58px"> <span>分钟</span></div><button id="saveReminders">保存提醒设置</button><p class="muted">提醒仅在软件运行时有效；计时需手动开始，关闭软件后自动暂停。待办每天独立保存。</p></section><script type="module" src="./renderer.js"></script><script src="./work.js"></script></body></html>
